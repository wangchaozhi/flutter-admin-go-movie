name: mobile
description: "mobile front"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  forui: ^0.21.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Vendored fork of media_kit 1.2.6 that enables HLS (hls.js) audio-track
# switching on the web. See packages/media_kit/README_FORK.md.
dependency_overrides:
  media_kit:
    path: packages/media_kit

flutter:
  uses-material-design: true
