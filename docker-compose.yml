networks:
  app-network:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    container_name: flutter-admin-go-postgres
    restart: unless-stopped
    networks:
      - app-network
    environment:
      POSTGRES_DB: flutter_admin_go
      POSTGRES_USER: admin_go
      POSTGRES_PASSWORD: admin_go_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_go -d flutter_admin_go"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flutter-admin-go-redis
    restart: unless-stopped
    networks:
      - app-network
    # disable RDB snapshots and AOF — pure in-memory is fine for a dev task queue
    command: redis-server --save "" --appendonly no --stop-writes-on-bgsave-error no
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: flutter-admin-go-minio
    restart: unless-stopped
    networks:
      - app-network
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin_go
      MINIO_ROOT_PASSWORD: admin_go_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  nginx:
    build:
      context: ./deploy/nginx
    container_name: flutter-admin-go-nginx
    restart: unless-stopped
    networks:
      - app-network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      HLS_SECRET: ${HLS_SECRET:-your_hls_secret_key_change_in_prod}
    ports:
      - "8081:80"
    volumes:
      - nginx_cache:/data/nginx/video_cache

volumes:
  pgdata:
  minio_data:
  redis_data:
  nginx_cache:
