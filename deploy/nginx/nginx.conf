proxy_cache_path /data/nginx/video_cache
    levels=1:2
    keys_zone=video_cache:500m
    max_size=10g
    inactive=7d
    use_temp_path=off;

server {
    listen 80;
    server_name _;

    location /hls/ {
        # sign = base64url(md5("{expires}{uri} {secret}"))
        # Must match Go's computeSign: fmt.Sprintf("%d%s %s", expires, path, secret)
        secure_link $arg_sign,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri ${HLS_SECRET}";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }

        # proxy to minio: /hls/{videoId}/... -> bucket video/hls/{videoId}/...
        proxy_pass http://minio:9000/video/hls/;
        proxy_set_header Host minio:9000;

        proxy_buffering on;
        proxy_request_buffering off;

        proxy_cache video_cache;
        proxy_cache_key $uri;
        proxy_cache_valid 200 206 7d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Cache-Status $upstream_cache_status;

        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
            video/mp4 mp4;
            text/vtt vtt;
        }

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
